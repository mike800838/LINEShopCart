<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好好選物｜購物車</title>
  <style>
    :root{--ink:#26332d;--muted:#748078;--green:#466653;--light:#f4f6f1;--line:#e3e8e1;--accent:#d9e5d7}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:#fbfcfa}
    button,input{font:inherit}
    button{cursor:pointer}
    .topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .nav{max-width:1180px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .logo{font-size:1.3rem;font-weight:800;letter-spacing:.12em;color:var(--green)}
    .nav small{color:var(--muted)}
    .cart-pill{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 15px;color:var(--green);font-weight:700}
    main{max-width:1180px;margin:34px auto;padding:0 22px 70px}
    .hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
    h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:0 0 8px;letter-spacing:.04em}
    .sub{color:var(--muted);margin:0}
    .layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,.9fr);gap:28px;align-items:start}
    .panel{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden}
    .panel-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .panel-head h2{font-size:1.05rem;margin:0}
    .items{padding:0 24px}
    .item{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:18px;padding:24px 0;border-bottom:1px solid var(--line);align-items:center}
    .item:last-child{border-bottom:0}
    .product-img{height:100px;width:100px;border-radius:14px;background:linear-gradient(145deg,#edf1e7,#d5e0d0);display:grid;place-items:center;font-size:2.5rem}
    .item h3{margin:0 0 6px;font-size:1rem}
    .desc{font-size:.88rem;color:var(--muted);margin:0 0 12px}
    .price{font-weight:800;color:var(--green)}
    .quantity{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;width:max-content;overflow:hidden;margin-top:12px}
    .quantity button{border:0;background:#f7f9f6;width:34px;height:32px;color:var(--green);font-size:1.1rem}
    .quantity span{min-width:34px;text-align:center;font-size:.9rem}
    .item-end{text-align:right;display:flex;flex-direction:column;align-items:end;gap:15px}
    .remove{border:0;background:none;color:#9aa39b;text-decoration:underline;font-size:.85rem}
    .summary{padding:24px;position:sticky;top:95px}
    .summary h2{margin:0 0 20px;font-size:1.15rem}
    .line{display:flex;justify-content:space-between;gap:12px;margin:15px 0;color:#647067}
    .line strong{color:var(--ink)}
    .total{border-top:1px solid var(--line);padding-top:18px;margin-top:20px;font-size:1.1rem;color:var(--ink)}
    .total strong{font-size:1.5rem;color:var(--green)}
    .note{background:var(--light);padding:13px 15px;border-radius:12px;color:#657369;font-size:.85rem;line-height:1.6;margin:20px 0}
    .checkout{width:100%;border:0;border-radius:999px;background:var(--green);color:white;padding:15px;font-weight:800;letter-spacing:.04em;transition:.2s}
    .checkout:hover{background:#354e3e;transform:translateY(-1px)}
    .continue{display:block;text-align:center;color:var(--green);margin-top:15px;text-decoration:none;font-size:.9rem}
    .empty{padding:60px 20px;text-align:center;color:var(--muted)}
    .empty .emoji{font-size:3rem;margin-bottom:15px}
    footer{text-align:center;color:#929b93;font-size:.85rem;padding:28px;border-top:1px solid var(--line)}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#26332d;color:white;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
    .toast.show{opacity:1}
    @media(max-width:800px){.layout{grid-template-columns:1fr}.summary{position:static}.hero{align-items:start;flex-direction:column}.nav{padding:14px 16px}main{padding:0 16px 45px;margin-top:25px}}
    @media(max-width:520px){.items{padding:0 15px}.panel-head{padding:18px 16px}.item{grid-template-columns:76px minmax(0,1fr);gap:13px;padding:19px 0}.product-img{width:76px;height:82px;font-size:2rem}.item-end{grid-column:2;flex-direction:row;justify-content:space-between;align-items:center;text-align:left;margin-top:-4px}.item h3{font-size:.95rem}.desc{font-size:.8rem;margin-bottom:8px}.quantity{margin-top:9px}.summary{padding:20px}.cart-pill{padding:8px 11px;font-size:.85rem}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="nav">
    <div><div class="logo">好好選物</div><small>讓日常，好好發生。</small></div>
    <button class="cart-pill" onclick="goShoppingCart()">購物車 <span id="navCount">0</span></button>
  </div>
</header>
<main id="cart">
  <section class="hero">
    <div><h1>DEMO LINE 選購</h1><p class="sub">喜歡的，就慢慢帶回家。</p></div>
    <small class="sub">所有商品皆為展示範例</small>
  </section>

  <section id="products" style="margin-top:30px">
    <div class="panel-head" style="padding-left:0;border:0"><h2>也許你會喜歡</h2></div>
    <div class="suggestions" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px">
      <div class="panel" style="padding:20px"><div class="product-img" style="width:100%;height:130px">🕯️</div><h3>森林靜心香氛蠟燭</h3><p class="desc">木質香氣，留一段安靜給自己。</p><strong>NT$ 680</strong><button class="checkout" style="margin-top:15px;padding:11px" onclick="addProduct(1)">加入購物車</button></div>
      <div class="panel" style="padding:20px"><div class="product-img" style="width:100%;height:130px">🌿</div><h3>草本淨化噴霧</h3><p class="desc">讓空間清新，也讓心慢下來。</p><strong>NT$ 420</strong><button class="checkout" style="margin-top:15px;padding:11px" onclick="addProduct(2)">加入購物車</button></div>
      <div class="panel" style="padding:20px"><div class="product-img" style="width:100%;height:130px">🧂</div><h3>海鹽祝福香氛組</h3><p class="desc">以香氣與儀式感，迎接日常。</p><strong>NT$ 880</strong><button class="checkout" style="margin-top:15px;padding:11px" onclick="addProduct(3)">加入購物車</button></div>
    </div>
  </section>
</main>
<footer>© 2026 好好選物 · 純前端購物車展示</footer>
<div class="toast" id="toast"></div>
<script>
	function goShoppingCart(){window.location.href ="ShoppingCart.html";}
  // 使用 localStorage 暫存購物車，重新整理後仍會保留；不需要後端或資料庫。
  const products = {
    1:{id:1,name:'森林靜心香氛蠟燭',desc:'木質調｜容量 180g',price:680,icon:'🕯️'},
    2:{id:2,name:'草本淨化噴霧',desc:'草本香氣｜容量 100ml',price:420,icon:'🌿'},
    3:{id:3,name:'海鹽祝福香氛組',desc:'香氛海鹽｜禮盒裝',price:880,icon:'🧂'}
  };
  let cart = JSON.parse(localStorage.getItem('hohoCart') || '{"1":1,"2":1}');
  function money(n){return 'NT$ '+n.toLocaleString('zh-TW')}
  function save(){localStorage.setItem('hohoCart',JSON.stringify(cart));render()}
  function addProduct(id){cart[id]=(cart[id]||0)+1;save();toast('已加入購物車')}
  function changeQty(id,delta){cart[id]=(cart[id]||0)+delta;if(cart[id]<=0)delete cart[id];save()}
  function removeItem(id){delete cart[id];save();toast('商品已移除')}
  function render(){
    const entries=Object.entries(cart).filter(([id,q])=>products[id]&&q>0);
    const count=entries.reduce((s,[,q])=>s+q,0);
    const subtotal=entries.reduce((s,[id,q])=>s+products[id].price*q,0);
    const shipping=subtotal===0||subtotal>=1500?0:80;
    document.getElementById('navCount').textContent=count;
  }
  function checkout(){if(!Object.keys(cart).length){toast('購物車是空的，先挑選喜歡的商品吧！');return}toast('這是前端展示版本，尚未串接付款功能。')}
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
  function showProducts(e){e.preventDefault();document.querySelector('#products').scrollIntoView({behavior:'smooth'})}
  render();
</script>
</body>
</html>
